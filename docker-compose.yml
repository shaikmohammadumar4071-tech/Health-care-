version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fedhospital_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fedadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fedpassword123}
      POSTGRES_DB: ${POSTGRES_DB:-hospital_fl}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fedadmin -d hospital_fl"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fedhospital_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://fedadmin:fedpassword123@db:5432/hospital_fl
      - SECRET_KEY=super-secret-key-for-smart-hospital-federated-learning-2026
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fedhospital_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
